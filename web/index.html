<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Office</title>
  <style>
    :root { --bg: #1c1517; --panel: #261d1d; --line: #3a2c28; --ink: #f6ead2; --muted: #a8968a; --accent: #e8875a; --chip: #33272a; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Galmuri11", ui-monospace, Menlo, monospace; overflow: hidden; }
    /* 기본(세로로 긴 창·화면 반쪽 분할): 위 = 맵, 아래 = 안내 */
    #app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: 1fr; }
    header { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
    #floors { display: flex; gap: 4px; flex-shrink: 0; }
    #floors button { font: inherit; font-size: 12px; color: var(--muted); background: var(--chip); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
    #floors button.on { color: #2a1d1c; background: var(--accent); border-color: var(--accent); }
    #hud { font-size: 12px; color: #d9c9b6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #hud b { color: var(--accent); }
    #hud span { color: var(--muted); }
    #hud .warn { color: #ff6b5a; font-style: normal; }
    #stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #game canvas { display: block; image-rendering: pixelated; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.45); }
    #guide { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 14px 12px; font-size: 12px; overflow: auto; max-height: 38vh; }
    #guide h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 1px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    #guide h2 small { color: var(--muted); font-weight: normal; font-size: 11px; letter-spacing: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 14px; }
    .z { display: grid; grid-template-columns: 4px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid #33282a; }
    .z i { width: 4px; height: 26px; border-radius: 2px; }
    .z b { font-size: 12px; }
    .z div span { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .z em { font-style: normal; min-width: 22px; text-align: center; padding: 1px 6px; background: var(--chip); color: var(--muted); font-size: 11px; border-radius: 4px; }
    .z em.on { background: var(--accent); color: #2a1d1c; }
    .tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 11px; }
    .tools button { font: inherit; font-size: 11px; color: #2a1d1c; background: #d6a748; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    .tools button:disabled { opacity: 0.6; }
    .tools label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    #collectors { margin-top: 8px; font-size: 11px; color: var(--muted); }
    #collectors .c-on { color: #86c060; } #collectors .c-absent, #collectors .c-error { color: #d6a748; } #collectors .c-off { color: #6e5e56; }
    .keys { color: #6e5e56; font-size: 10px; margin-top: 8px; }
    /* 커서를 올리면 뜨는 말풍선 */
    #bubble { position: absolute; display: none; transform: translate(-50%, calc(-100% - 10px)); pointer-events: none; z-index: 10;
      background: #fbf3e2; color: #2a1d1c; border: 2px solid #2a1d1c; border-radius: 10px; padding: 7px 10px; font-size: 12px; line-height: 1.5;
      max-width: 260px; min-width: 120px; box-shadow: 0 6px 18px rgba(0,0,0,0.35); }
    #bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 7px solid transparent; border-top-color: #2a1d1c; border-bottom: 0; }
    #bubble::before { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #fbf3e2; border-bottom: 0; z-index: 1; }
    #bubble b { font-size: 12px; }
    #bubble .zone { margin-left: 6px; font-size: 11px; color: #8a5e3e; }
    #bubble i { font-style: normal; color: #8a5e3e; font-size: 11px; }
    #bubble div { margin-top: 2px; word-break: break-all; }
    #bubble small { color: #8a7a6e; font-size: 10px; }
    /* 가로로 넓은 창: 오른쪽에 안내 */
    @media (min-aspect-ratio: 3/2) and (min-width: 1100px) {
      #app { grid-template-columns: 1fr 270px; grid-template-rows: auto 1fr; }
      header { grid-column: 1 / 3; }
      #guide { grid-row: 2; grid-column: 2; border-top: 0; border-left: 1px solid var(--line); max-height: none; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div id="floors"><button data-floor="office" class="on">1F 사무실</button><button data-floor="research">B1 연구실</button></div>
      <div id="hud">불러오는 중…</div>
    </header>
    <main id="stage"><div id="game"></div></main>
    <aside id="guide">
      <section id="zones-panel">
        <h2>부서 안내 <small>세션이 하는 일에 따라 그 부서로 걸어가요 · 캐릭터에 커서를 올리면 하는 일이 보여요</small></h2>
        <div id="zones" class="grid"></div>
        <div id="collectors" class="keys"></div>
        <div class="keys">Tab 층 전환 · 숫자키 1~9 첫 직원 보내기 · F 전체화면</div>
      </section>
      <section id="research-panel" hidden>
        <h2>연구실 <small>research-log 기록을 읽어서 보여줘요 (수정하지 않음)</small></h2>
        <div id="research-list" class="grid"></div>
        <div class="tools">
          <button id="draft-btn">이번 주 로그 초안 만들기</button>
          <label><input type="checkbox" id="public-toggle"> 공개 모드 (프로젝트명 익명화)</label>
          <span id="draft-out"></span>
        </div>
        <div class="keys">Tab 층 전환 · 방이나 연구원에 커서를 올리면 기록 상태가 보여요</div>
      </section>
    </aside>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
