<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Office</title>
  <style>
    :root { --bg: #1c1517; --panel: #261d1d; --line: #3a2c28; --ink: #f6ead2; --muted: #a8968a; --accent: #e8875a; --chip: #33272a;
      /* 떠 있는 창(툴팁·사원증·부서 안내·로그) 공통 스타일 */
      --pop-bg: #fbf3e2; --pop-ink: #2a1d1c; --pop-muted: #8a7a6e; --pop-line: #e6d8bd; --pop-border: 2px solid #2a1d1c; --pop-radius: 10px; --pop-shadow: 0 8px 24px rgba(0,0,0,.35); }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Galmuri11", ui-monospace, Menlo, monospace; -webkit-font-smoothing: none; overflow: hidden; }
    /* 기본(세로로 긴 창·화면 반쪽 분할): 위 = 맵, 아래 = 안내 */
    #app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr; }
    header { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--line); min-width: 0; }
    #floors { display: flex; gap: 4px; flex-shrink: 0; }
    #floors button { font: inherit; font-size: 11px; color: var(--muted); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
    #floors button.on { color: #2a1d1c; background: var(--accent); border-color: var(--accent); }
    #hud { font-size: 11px; color: #d9c9b6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    #hud b { color: var(--accent); }
    #hud span { color: var(--muted); }
    #hud .warn { color: #ff6b5a; font-style: normal; }
    #stage { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #game canvas { display: block; image-rendering: pixelated; }
    /* 부서 안내: 평소엔 숨김, 상단 "부서 안내" 버튼이나 H 키로 맵 위에 작은 창 */
    #guide { position: absolute; top: 10px; right: 10px; width: min(340px, calc(100% - 20px)); max-height: calc(100% - 20px); overflow: auto; z-index: 15;
      background: var(--pop-bg); color: var(--pop-ink); border: var(--pop-border); border-radius: var(--pop-radius); padding: 10px 12px 12px; font-size: 11px; box-shadow: var(--pop-shadow); display: none; }
    #guide h2 small, #guide .z div span, #guide .keys, #guide #collectors { color: var(--pop-muted); }
    #guide .z { border-bottom-color: var(--pop-line); }
    #guide .z em { background: #efe4cf; color: var(--pop-muted); }
    #guide .z em.on { background: var(--accent); color: var(--pop-ink); }
    #guide .close { color: var(--pop-muted); }
    #guide.open { display: block; }
    #guide .close { position: absolute; top: 6px; right: 8px; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; cursor: pointer; }
    #guide .grid { grid-template-columns: 1fr !important; }
    #guide h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: 1px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    #guide h2 small { color: var(--muted); font-weight: normal; font-size: 11px; letter-spacing: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 4px 14px; }
    .z { display: grid; grid-template-columns: 4px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid #33282a; }
    .z i { width: 4px; height: 26px; border-radius: 2px; }
    .z b { font-size: 11px; }
    .z div span { display: block; color: var(--muted); font-size: 11px; margin-top: 1px; }
    .z em { font-style: normal; min-width: 22px; text-align: center; padding: 1px 6px; background: var(--chip); color: var(--muted); font-size: 11px; border-radius: 4px; }
    .z em.on { background: var(--accent); color: #2a1d1c; }
    .tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 11px; }
    .tools button { font: inherit; font-size: 11px; color: #2a1d1c; background: #d6a748; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
    .tools button:disabled { opacity: 0.6; }
    .tools label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    #collectors { margin-top: 8px; font-size: 11px; color: var(--muted); }
    #collectors .c-on { color: #86c060; } #collectors .c-absent, #collectors .c-error { color: #d6a748; } #collectors .c-off { color: #6e5e56; }
    .keys { color: #6e5e56; font-size: 11px; margin-top: 8px; }

    /* 오른쪽 위: 토큰 위젯 + 토글 */
    #right { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
    #tokens { display: flex; gap: 10px; align-items: center; font-size: 11px; color: #d9c9b6; background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; white-space: nowrap; }
    #tokens .bar { width: 54px; height: 6px; background: #1c1517; border-radius: 3px; overflow: hidden; display: inline-block; }
    #tokens .bar i { display: block; height: 100%; }
    #tokens .lim { color: #ff6b5a; font-weight: bold; }
    #tokens .warn { color: #ff6b5a; }
    /* 날씨 칩: 아이콘 · 기온 · 날씨 이름 (커서를 올리면 동네·강수·바람) */
    #weather { display: flex; gap: 5px; align-items: center; font-size: 11px; color: #d9c9b6; background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; white-space: nowrap; cursor: default; }
    #weather[hidden] { display: none; }
    #weather .wi { font-size: 13px; line-height: 1; }
    #weather b { color: var(--ink); font-weight: normal; }
    /* 번개: 뇌우일 때 가끔 화면이 은은하게 두 번 번쩍 */
    #lightning { position: absolute; inset: 0; pointer-events: none; z-index: 4; background: #f4f8ff; opacity: 0; }
    #lightning.on { animation: bolt 0.9s ease-out; }
    @keyframes bolt { 0% { opacity: 0; } 6% { opacity: .26; } 14% { opacity: .04; } 22% { opacity: .2; } 100% { opacity: 0; } }
    .tog { font: inherit; font-size: 11px; color: var(--muted); background: var(--chip); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
    .tog.on { color: #2a1d1c; background: #d6a748; border-color: #d6a748; }
    @media (max-width: 900px) { #btn-typing, #btn-nature { display: none; } #hud { display: none; } }
    /* "확인 필요" 테두리 */
    #stage.waiting::after { content: ""; position: absolute; inset: 4px; border: 3px solid #ffd166; border-radius: 12px; pointer-events: none; animation: breathe 1.6s ease-in-out infinite; z-index: 5; }
    #stage.hit::before { content: ""; position: absolute; inset: 0; background: rgba(255,209,102,0.22); pointer-events: none; animation: hit 1.2s ease-out forwards; z-index: 6; }
    @keyframes breathe { 0%,100% { opacity: .25; } 50% { opacity: .95; } }
    @keyframes hit { from { opacity: 1; } to { opacity: 0; } }
    /* 이벤트 로그 바 */
    #log { position: absolute; left: 10px; bottom: 10px; max-width: min(420px, calc(100% - 20px)); z-index: 7; font-size: 11px; opacity: .9; transition: opacity .2s; }
    #log:hover { opacity: 1; }
    #log-toggle { font: inherit; font-size: 11px; color: var(--pop-ink); background: var(--pop-bg); border: var(--pop-border); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 1px 8px; cursor: pointer; }
    #log ul { list-style: none; margin: 0; padding: 4px 8px; background: rgba(251,243,226,.82); color: var(--pop-ink); border: var(--pop-border); border-radius: 0 var(--pop-radius) var(--pop-radius) var(--pop-radius); max-height: 0; overflow: hidden; transition: max-height .25s; box-shadow: var(--pop-shadow); }
    #log.open ul { max-height: 90px; }
    #log:not(.open) ul { padding: 0 8px; border-width: 0; }
    #log li { display: flex; gap: 6px; padding: 2px 0; color: var(--pop-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #log li:first-child { font-weight: bold; }
    #log time { color: var(--pop-muted); }
    #log b { color: #b8582f; font-weight: normal; }
    #log i { font-style: normal; width: 10px; text-align: center; }
    #log .k-wait i, #log .k-wait b { color: #b8862a; }
    #log .k-done i { color: #4f8a3a; }
    #log .empty { color: var(--pop-muted); }
    /* 사원증 카드 */
    #card { position: absolute; inset: 0; background: rgba(20,12,14,0.55); display: flex; align-items: center; justify-content: center; z-index: 20; cursor: pointer; }
    #card[hidden] { display: none; }
    .badge { position: relative; width: 250px; background: var(--pop-bg); color: var(--pop-ink); border: var(--pop-border); border-radius: var(--pop-radius); padding: 18px 16px 12px; box-shadow: var(--pop-shadow); }
    .badge .strap { position: absolute; top: -40px; left: 50%; width: 22px; height: 46px; transform: translateX(-50%); background: var(--c); border: 2px solid #2a1d1c; border-radius: 4px; }
    .badge .top { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1px; background: var(--c); margin: -18px -16px 10px; padding: 6px 12px; border-radius: 8px 8px 0 0; font-weight: bold; }
    .badge .body { display: flex; gap: 12px; align-items: center; }
    .badge canvas { width: 64px; height: 96px; image-rendering: pixelated; border: 2px solid #2a1d1c; border-radius: 6px; background: #efe2c6; }
    .badge .who b { display: block; font-size: 16px; }
    .badge .who em { display: inline-block; font-style: normal; font-size: 11px; background: var(--c); padding: 1px 6px; border-radius: 4px; margin: 3px 0; }
    .badge .who span { display: block; font-size: 11px; color: #6e5440; }
    .badge .who em.lv { background: #2a1d1c; color: #ffd98a; margin-left: 4px; }
    .badge .hprow { display: flex; align-items: center; gap: 6px; margin: 10px 0 -4px; font-size: 11px; }
    .badge .hprow b { font-size: 10px; color: #f2b84b; background: #2a1d1c; padding: 1px 4px; border-radius: 3px; }
    .badge .hprow span { flex: 1; height: 7px; background: #5a4a44; border: 2px solid #2a1d1c; border-radius: 5px; overflow: hidden; }
    .badge .hprow span i { display: block; height: 100%; }
    .badge .hprow small { color: #6e5440; white-space: nowrap; }
    .badge dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 11px; margin: 12px 0 8px; }
    .badge dt { color: #8a7a6e; } .badge dd { margin: 0; word-break: break-all; }
    .badge strong { font-size: 13px; }
    .badge h4 { margin: 8px 0 4px; font-size: 11px; color: #8a7a6e; }
    .badge ol { margin: 0; padding-left: 16px; font-size: 11px; }
    .badge ol li { margin: 2px 0; } .badge ol small { color: #8a7a6e; margin-left: 4px; }
    .badge .foot { margin-top: 10px; font-size: 11px; color: #a8968a; text-align: center; }
    /* 커서를 올리면 뜨는 말풍선 */
    #bubble { position: absolute; display: none; transform: translate(-50%, calc(-100% - 10px)); pointer-events: none; z-index: 10;
      background: var(--pop-bg); color: var(--pop-ink); border: var(--pop-border); border-radius: var(--pop-radius); padding: 8px 10px; font-size: 11px; line-height: 1.5;
      max-width: 260px; min-width: 120px; box-shadow: var(--pop-shadow); }
    #bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 7px solid transparent; border-top-color: #2a1d1c; border-bottom: 0; }
    #bubble::before { content: ""; position: absolute; left: 50%; bottom: -5px; transform: translateX(-50%); border: 6px solid transparent; border-top-color: #fbf3e2; border-bottom: 0; z-index: 1; }
    #bubble b { font-size: 11px; }
    #bubble .zone { margin-left: 6px; font-size: 11px; color: #8a5e3e; }
    #bubble i { font-style: normal; color: #8a5e3e; font-size: 11px; }
    #bubble div { margin-top: 2px; word-break: break-all; }
    #bubble small { color: #8a7a6e; font-size: 11px; }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div id="floors"><button data-floor="office" class="on">1F 사무실</button><button data-floor="research">B1 연구실</button></div>
      <div id="hud">불러오는 중…</div>
      <div id="right">
        <div id="weather" hidden></div>
        <div id="tokens" title="토큰 사용량 (이 컴퓨터의 Claude Code 기록 기준)"></div>
        <button id="btn-guide" class="tog" title="부서 안내 열기/닫기 (H)">📋 부서 안내</button>
        <button id="btn-alerts" class="tog"></button>
        <button id="btn-typing" class="tog"></button>
        <button id="btn-nature" class="tog" title="진짜 날씨에 맞춘 빗소리·새소리 (아주 작게)"></button>
      </div>
    </header>
    <main id="stage"><div id="game"></div><div id="lightning"></div>
      <div id="log"><button id="log-toggle"></button><ul></ul></div>
      <div id="card" hidden></div>
      <aside id="guide"><button class="close" id="guide-close" title="닫기 (H)">✕</button>
        <section id="zones-panel">
          <h2>부서 안내 <small>세션이 하는 일에 따라 그 부서로 걸어가요 · 캐릭터에 커서를 올리면 하는 일이 보여요</small></h2>
          <div id="zones" class="grid"></div>
          <div id="collectors" class="keys"></div>
          <div class="keys">H 안내 닫기 · Tab 층 전환 · 숫자키 1~9 첫 직원 보내기 · F 전체화면</div>
        </section>
        <section id="research-panel" hidden>
          <h2>연구실 <small>research-log 기록을 읽어서 보여줘요 (수정하지 않음)</small></h2>
          <div id="research-list" class="grid"></div>
          <div class="tools">
            <button id="draft-btn">이번 주 로그 초안 만들기</button>
            <label><input type="checkbox" id="public-toggle"> 공개 모드 (프로젝트명 익명화)</label>
            <span id="draft-out"></span>
          </div>
          <div class="keys">Tab 층 전환 · 방이나 연구원에 커서를 올리면 기록 상태가 보여요</div>
        </section>
      </aside>
    </main>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
